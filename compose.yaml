services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: image_search
      POSTGRES_USER: image_search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U image_search -d image_search"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
  neo4j:
    image: neo4j:5.26.33-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${IMAGE_SEARCH_GRAPH_PASSWORD:-change-me}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j-data:/data"]
    mem_limit: 2g
volumes:
  neo4j-data:
  postgres-data:
  qdrant-data:
