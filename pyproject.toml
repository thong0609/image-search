[project]
name = "image-search"
version = "0.1.0"
description = "Vietnamese landmark image search"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "qdrant-client>=1.13,<2", "pillow>=11,<13", "pyyaml>=6,<7", "httpx>=0.28,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/image_search"]
[project.scripts]
image-search-worker = "image_search.modules.jobs.worker:main"
image-search-smoke = "image_search.smoke:main"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL and Qdrant"]
